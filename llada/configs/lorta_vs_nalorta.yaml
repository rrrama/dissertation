# Head-to-head comparison of LoRTA vs NA-LoRTA on GSM8K.
# `tuning_type` is a list -> two runs (lorta, nalorta) with every other
# hyperparameter held fixed, so any difference is attributable to the adapter.

model_name_or_path: "GSAI-ML/LLaDA-8B-Instruct"
tuning_type: ["lorta", "nalorta"]
rank: 128
lora_alpha: 4

data_name: "gsm8k"

learning_rate: 0.05
num_train_epochs: 6
per_device_train_batch_size: 2
gradient_accumulation_steps: 10
# 6 epochs measures ~8 h on 3x L40, which is exactly `_slurm_settings`' default
# budget; nothing resumes from a checkpoint, so a wall-clock kill would lose the
# run. Ask for the old 12 h explicitly rather than inherit the shorter default.
sbatch_time: "12:00:00"
gradient_checkpointing: false
warmup_ratio: 0.03
lr_scheduler_type: "cosine"
seed: 42
model_max_length: 512

expt_name: "llada_gsm8k_training"
wandb_project: "llada_gsm8k_training"
report_to: "wandb"
logging_strategy: "steps"
logging_steps: 10
save_strategy: "steps"
save_steps: 100
eval_steps: 100

mask_id: 126336
diffusion_eps: 0.001
gen_length: 256
diffusion_steps: 256
# See baseline.yaml for why this is 32 and not gen_length.
block_length: 32
remasking: "low_confidence"
gen_temperature: 0.0
# questions decoded simultaneously per rank in benchmark mode (1 = the old
# one-at-a-time path); memory-bound, see BENCHMARK_PERF.md §4
benchmark_batch_size: 8

# One GPU per run, so the arms train and decode concurrently rather than queueing
# behind each other. Was `3`, a fixed cluster allocation. Scaling within a run is
# imperfect, so N runs at 1 GPU each finish no later than N runs serialised across
# N GPUs -- and this way the two arms are also perfectly time-matched. Raise it
# only if the box has more GPUs than this config has runs. `gres` was the slurm
# side of the same request and no longer does anything (SLURM_MIGRATION.md §1.4).
nproc_per_node: 1

benchmark: "gsm8k_accuracy"
