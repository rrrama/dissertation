# Untuned baseline: score the bare LLaDA-8B-Instruct on GSM8K with no adapter.
#
#   python batch_train.py --mode benchmark --config configs/baseline.yaml
#
# There is nothing to train, so `--mode benchmark` is the whole job (`--mode all`
# works too and submits the same single benchmark). Results land in
# outputs/baseline/none/benchmark.json.
#
# `tuning_type` is a one-element *list* purely for naming: a scalar leaves the
# run with no varying field and it gets called `run_000`, whereas the list names
# the directory `none`.
#
# Every decoding setting below is copied from nara_vs_nalorta.yaml so the number
# is directly comparable to the adapters in that sweep. Training hyperparameters
# are omitted -- no training happens.

model_name_or_path: "GSAI-ML/LLaDA-8B-Instruct"
tuning_type: ["none"]

data_name: "gsm8k"
seed: 42
model_max_length: 512

expt_name: "llada_gsm8k_baseline"
wandb_project: "llada_gsm8k_training"
report_to: "wandb"

mask_id: 126336
gen_length: 256
diffusion_steps: 256
# Semi-autoregressive decoding, as LLaDA's reference eval uses for the *Instruct*
# model. With block_length == gen_length the low-confidence topk ranks all 256
# response positions against each other, and LLaDA-Instruct is SFT'd with EOS
# padding out to a fixed length -- so EOS in the far tail is near-certain and wins
# the first sampling steps outright, walling off the answer before a single
# content token is placed. 8 blocks x 32 steps is the same 256 forwards per
# question, so this costs nothing.
block_length: 32
remasking: "low_confidence"
gen_temperature: 0.0
benchmark_batch_size: 8

# Every GPU on the box. This config expands to a single run, so there is nothing
# to schedule alongside it and the decode shards cleanly across ranks (each rank
# takes its own slice of the test set). Was `3`, a fixed cluster allocation; `all`
# does not need to know what hardware it is on. `gres` was the slurm side of the
# same request and no longer does anything -- see SLURM_MIGRATION.md §1.4.
nproc_per_node: all

benchmark: "gsm8k_accuracy"
